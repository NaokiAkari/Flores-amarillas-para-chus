<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>🌻 Feliz Día de las Flores Amarillas 🌻</title>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: black;
            font-family: "Trebuchet MS", "Comic Sans MS", sans-serif;
        }

        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            background: black;
        }

    </style>

</head>

<body>

<canvas id="canvas"></canvas>

<script>

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let W;
let H;
let escala;

let estrellas = [];
let corazones = [];
let pasto = [];
let floresPequenas = [];
let girasoles = [];

let tiempo = 0;


// ============================================================
// AJUSTAR PANTALLA
// ============================================================

function ajustarPantalla() {

    const dpr = Math.min(window.devicePixelRatio || 1, 2);

    W = window.innerWidth;
    H = window.innerHeight;

    canvas.width = W * dpr;
    canvas.height = H * dpr;

    canvas.style.width = W + "px";
    canvas.style.height = H + "px";

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    escala = Math.min(
        W / 1300,
        H / 750
    );

    crearEscena();
}


// ============================================================
// CONVERTIR COORDENADAS
// ============================================================

function X(x) {

    return W / 2 + x * escala;

}

function Y(y) {

    return H / 2 - y * escala;

}


// ============================================================
// NÚMEROS ALEATORIOS
// ============================================================

function aleatorio(min, max) {

    return min + Math.random() * (max - min);

}


function elegir(lista) {

    return lista[
        Math.floor(Math.random() * lista.length)
    ];

}


// ============================================================
// CREAR ESCENA
// ============================================================

function crearEscena() {

    estrellas = [];
    corazones = [];
    pasto = [];
    floresPequenas = [];


    // --------------------------------------------------------
    // ESTRELLAS
    // --------------------------------------------------------

    for (let i = 0; i < 105; i++) {

        estrellas.push({

            x: aleatorio(-620, 620),

            y: aleatorio(40, 350),

            radio: aleatorio(1.2, 3.5),

            fase: aleatorio(
                0,
                Math.PI * 2
            )

        });

    }


    // --------------------------------------------------------
    // CORAZONES
    // --------------------------------------------------------

    corazones = [

        {
            x: -470,
            y: 210,
            tamaño: 25
        },

        {
            x: 360,
            y: 190,
            tamaño: 25
        },

        {
            x: 180,
            y: -120,
            tamaño: 20
        },

        {
            x: -180,
            y: -90,
            tamaño: 20
        },

        {
            x: 520,
            y: 50,
            tamaño: 18
        }

    ];


    // --------------------------------------------------------
    // PASTO
    // --------------------------------------------------------

    for (let x = -640; x <= 640; x += 8) {

        pasto.push({

            x: x,

            altura: aleatorio(
                20,
                80
            ),

            inclinacion: aleatorio(
                -18,
                18
            )

        });

    }


    // --------------------------------------------------------
    // FLORES PEQUEÑAS
    // --------------------------------------------------------

    for (let i = 0; i < 35; i++) {

        floresPequenas.push({

            x: aleatorio(-600, 600),

            y: aleatorio(-350, -270),

            tamaño: aleatorio(5, 9),

            fase: aleatorio(
                0,
                Math.PI * 2
            )

        });

    }


    // --------------------------------------------------------
    // GIRASOLES
    // --------------------------------------------------------

    girasoles = [

        {
            x: -500,
            y: -135,
            tamaño: 48
        },

        {
            x: -260,
            y: -230,
            tamaño: 38
        },

        {
            x: 245,
            y: -225,
            tamaño: 38
        },

        {
            x: 500,
            y: -130,
            tamaño: 48
        },

        {
            x: -60,
            y: -270,
            tamaño: 25
        },

        {
            x: 100,
            y: -275,
            tamaño: 23
        },

        {
            x: 370,
            y: -260,
            tamaño: 27
        }

    ];

}


// ============================================================
// ESTRELLA GRANDE
// ============================================================

function dibujarEstrella(
    x,
    y,
    radio
) {

    ctx.save();

    ctx.translate(
        X(x),
        Y(y)
    );

    ctx.strokeStyle = "#FFD700";

    ctx.lineWidth = 2;

    ctx.beginPath();

    ctx.moveTo(
        0,
        -radio * escala
    );

    ctx.lineTo(
        0,
        radio * escala
    );

    ctx.moveTo(
        -radio * escala,
        0
    );

    ctx.lineTo(
        radio * escala,
        0
    );

    ctx.moveTo(
        -radio * .7 * escala,
        -radio * .7 * escala
    );

    ctx.lineTo(
        radio * .7 * escala,
        radio * .7 * escala
    );

    ctx.moveTo(
        -radio * .7 * escala,
        radio * .7 * escala
    );

    ctx.lineTo(
        radio * .7 * escala,
        -radio * .7 * escala
    );

    ctx.stroke();

    ctx.restore();

}


// ============================================================
// LUNA
// ============================================================

function dibujarLuna() {

    const x = X(500);
    const y = Y(260);

    const radio = 65 * escala;


    // Halo

    ctx.save();

    ctx.shadowBlur = 30 * escala;

    ctx.shadowColor = "#FFD84A";

    ctx.fillStyle = "#FFE66D";

    ctx.beginPath();

    ctx.arc(
        x,
        y,
        radio,
        0,
        Math.PI * 2
    );

    ctx.fill();

    ctx.shadowBlur = 0;


    // Parte negra

    ctx.fillStyle = "black";

    ctx.beginPath();

    ctx.arc(
        X(470),
        Y(280),
        60 * escala,
        0,
        Math.PI * 2
    );

    ctx.fill();


    // Pequeños detalles

    ctx.fillStyle = "#F5D84A";

    ctx.globalAlpha = .6;

    ctx.beginPath();

    ctx.arc(
        X(525),
        Y(285),
        4 * escala,
        0,
        Math.PI * 2
    );

    ctx.fill();


    ctx.beginPath();

    ctx.arc(
        X(515),
        Y(240),
        3 * escala,
        0,
        Math.PI * 2
    );

    ctx.fill();


    ctx.beginPath();

    ctx.arc(
        X(545),
        Y(265),
        2 * escala,
        0,
        Math.PI * 2
    );

    ctx.fill();

    ctx.restore();

}


// ============================================================
// CORAZÓN
// ============================================================

function dibujarCorazon(
    x,
    y,
    tamaño
) {

    ctx.save();

    ctx.translate(
        X(x),
        Y(y)
    );

    ctx.scale(
        escala,
        escala
    );

    ctx.strokeStyle = "#FFD21C";

    ctx.lineWidth = 3;

    ctx.beginPath();

    ctx.moveTo(
        0,
        tamaño * .85
    );

    ctx.bezierCurveTo(
        -tamaño * 1.3,
        tamaño * .05,
        -tamaño * .75,
        -tamaño * .8,
        0,
        -tamaño * .2
    );

    ctx.bezierCurveTo(
        tamaño * .75,
        -tamaño * .8,
        tamaño * 1.3,
        tamaño * .05,
        0,
        tamaño * .85
    );

    ctx.stroke();

    ctx.restore();

}


// ============================================================
// HOJA
// ============================================================

function dibujarHoja(
    x,
    y,
    tamaño,
    angulo
) {

    ctx.save();

    ctx.translate(
        X(x),
        Y(y)
    );

    ctx.rotate(
        -angulo * Math.PI / 180
    );

    ctx.scale(
        escala,
        escala
    );

    ctx.fillStyle = "#2E8B22";

    ctx.beginPath();

    ctx.moveTo(
        0,
        0
    );

    ctx.bezierCurveTo(
        tamaño * .2,
        -tamaño,

        tamaño * 1.3,
        -tamaño * 1.1,

        tamaño * 1.25,
        0
    );

    ctx.bezierCurveTo(
        tamaño * 1.1,
        tamaño * .75,

        tamaño * .25,
        tamaño * .85,

        0,
        0
    );

    ctx.fill();


    // Nervadura

    ctx.strokeStyle = "#66A833";

    ctx.lineWidth = 2;

    ctx.beginPath();

    ctx.moveTo(
        0,
        0
    );

    ctx.lineTo(
        tamaño * 1.15,
        -tamaño * .1
    );

    ctx.stroke();

    ctx.restore();

}


// ============================================================
// TALLO
// ============================================================

function dibujarTallo(
    x,
    y,
    tamaño
) {

    ctx.save();

    ctx.strokeStyle = "#218B21";

    ctx.lineWidth =
        Math.max(
            4,
            tamaño / 5
        ) * escala;

    ctx.lineCap = "round";

    ctx.beginPath();

    ctx.moveTo(
        X(x),
        Y(y - tamaño * 3.8)
    );

    ctx.lineTo(
        X(x),
        Y(y - tamaño * .15)
    );

    ctx.stroke();

    ctx.restore();

}


// ============================================================
// PÉTALO DEL GIRASOL
// ============================================================

function dibujarPetalo(
    centroX,
    centroY,
    tamaño,
    angulo,
    segundaFila
) {

    const radianes =
        angulo * Math.PI / 180;


    // Dirección del pétalo

    const direccionX =
        Math.cos(radianes);

    const direccionY =
        Math.sin(radianes);


    // Distancia desde el centro

    const distancia =
        tamaño *
        (
            .58 +
            (segundaFila ? .02 : 0)
        );


    const petaloX =
        centroX +
        direccionX * distancia;


    const petaloY =
        centroY +
        direccionY * distancia;


    ctx.save();

    ctx.translate(
        X(petaloX),
        Y(petaloY)
    );

    ctx.rotate(
        -radianes
    );

    ctx.scale(
        escala,
        escala
    );


    const largo =
        tamaño *
        1.05 *
        (segundaFila ? .88 : 1);


    const ancho =
        tamaño * .38;


    // Degradado amarillo

    const degradado =
        ctx.createLinearGradient(
            -largo / 2,
            0,
            largo / 2,
            0
        );


    degradado.addColorStop(
        0,
        "#FFC400"
    );

    degradado.addColorStop(
        .55,
        "#FFD21C"
    );

    degradado.addColorStop(
        1,
        "#FFE45A"
    );


    ctx.fillStyle = degradado;


    // Forma del pétalo

    ctx.beginPath();

    ctx.moveTo(
        -largo * .48,
        0
    );

    ctx.bezierCurveTo(

        -largo * .15,
        -ancho,

        largo * .32,
        -ancho * 1.05,

        largo * .5,
        0

    );

    ctx.bezierCurveTo(

        largo * .32,
        ancho * 1.05,

        -largo * .15,
        ancho,

        -largo * .48,
        0

    );

    ctx.closePath();

    ctx.fill();

    ctx.restore();

}


// ============================================================
// GIRASOL
// ============================================================

function dibujarGirasol(
    flor
) {

    const x =
        flor.x;

    const y =
        flor.y;

    const tamaño =
        flor.tamaño;


    // --------------------------------------------------------
    // TALLO
    // --------------------------------------------------------

    dibujarTallo(
        x,
        y,
        tamaño
    );


    // --------------------------------------------------------
    // HOJAS
    // --------------------------------------------------------

    dibujarHoja(
        x,
        y - tamaño * 2,
        tamaño,
        145
    );

    dibujarHoja(
        x,
        y - tamaño * 3,
        tamaño * .95,
        35
    );


    // --------------------------------------------------------
    // PÉTALOS
    // --------------------------------------------------------

    for (
        let angulo = 0;
        angulo < 360;
        angulo += 30
    ) {

        dibujarPetalo(
            x,
            y,
            tamaño,
            angulo,
            false
        );

    }


    for (
        let angulo = 15;
        angulo < 360;
        angulo += 30
    ) {

        dibujarPetalo(
            x,
            y,
            tamaño * .82,
            angulo,
            true
        );

    }


    // ========================================================
    // CENTRO DEL GIRASOL
    // ========================================================
    //
    // ESTE ES EL PUNTO IMPORTANTE:
    //
    // El centro marrón se dibuja DESPUÉS de los pétalos.
    //
    // x,y es exactamente el centro.
    //
    // ========================================================

    const centroX =
        X(x);

    const centroY =
        Y(y);

    const radio =
        tamaño * .52 * escala;


    // Centro exterior

    ctx.save();

    ctx.shadowBlur =
        8 * escala;

    ctx.shadowColor =
        "#6B3200";

    ctx.fillStyle =
        "#7A3B00";

    ctx.beginPath();

    ctx.arc(
        centroX,
        centroY,
        radio,
        0,
        Math.PI * 2
    );

    ctx.fill();


    // Centro interior

    ctx.shadowBlur = 0;

    ctx.fillStyle =
        "#3B1800";

    ctx.beginPath();

    ctx.arc(
        centroX,
        centroY,
        radio * .71,
        0,
        Math.PI * 2
    );

    ctx.fill();


    // --------------------------------------------------------
    // SEMILLAS
    // --------------------------------------------------------

    ctx.fillStyle =
        "#D99A20";

    for (
        let i = 0;
        i < 22;
        i++
    ) {

        const angulo =
            i * 2.399;

        const distancia =
            radio *
            (
                .22 +
                .58 * (i / 22)
            );


        const semillaX =
            centroX +
            Math.cos(angulo) *
            distancia;


        const semillaY =
            centroY +
            Math.sin(angulo) *
            distancia;


        ctx.beginPath();

        ctx.arc(
            semillaX,
            semillaY,
            Math.max(
                1.5,
                1.8 * escala
            ),
            0,
            Math.PI * 2
        );

        ctx.fill();

    }

    ctx.restore();

}


// ============================================================
// FLORES PEQUEÑAS
// ============================================================

function dibujarFlorPequena(
    flor
) {

    const x =
        X(flor.x);

    const y =
        Y(flor.y);

    const tamaño =
        flor.tamaño * escala;


    ctx.fillStyle =
        "#FFD21C";


    for (
        let i = 0;
        i < 5;
        i++
    ) {

        const angulo =
            i * Math.PI * 2 / 5;


        ctx.beginPath();

        ctx.arc(

            x +
            Math.cos(angulo) *
            tamaño * .8,

            y +
            Math.sin(angulo) *
            tamaño * .8,

            tamaño * .55,

            0,
            Math.PI * 2

        );

        ctx.fill();

    }


    // Centro

    ctx.fillStyle =
        "#8A4800";

    ctx.beginPath();

    ctx.arc(
        x,
        y,
        tamaño * .45,
        0,
        Math.PI * 2
    );

    ctx.fill();

}


// ============================================================
// PASTO
// ============================================================

function dibujarPasto() {

    pasto.forEach(
        function(hierba) {

            ctx.save();

            ctx.strokeStyle =
                elegir([
                    "#0D5018",
                    "#146B1E",
                    "#208522",
                    "#2A9525"
                ]);


            ctx.lineWidth =
                elegir([
                    2,
                    3,
                    4
                ]) * escala;


            ctx.lineCap =
                "round";


            ctx.beginPath();

            ctx.moveTo(
                X(hierba.x),
                Y(-360)
            );


            ctx.quadraticCurveTo(

                X(
                    hierba.x +
                    hierba.inclinacion * .5
                ),

                Y(
                    -360 +
                    hierba.altura * .55
                ),

                X(
                    hierba.x +
                    hierba.inclinacion
                ),

                Y(
                    -360 +
                    hierba.altura
                )

            );

            ctx.stroke();

            ctx.restore();

        }
    );

}


// ============================================================
// MARIPOSA
// ============================================================

function dibujarMariposa() {

    const x =
        X(-480);

    const y =
        Y(170);


    ctx.save();


    // Alas amarillas

    ctx.fillStyle =
        "#FFD21C";


    ctx.beginPath();

    ctx.arc(
        x - 10 * escala,
        y,
        10 * escala,
        0,
        Math.PI * 2
    );

    ctx.fill();


    ctx.beginPath();

    ctx.arc(
        x + 10 * escala,
        y,
        10 * escala,
        0,
        Math.PI * 2
    );

    ctx.fill();


    // Alas inferiores

    ctx.fillStyle =
        "#F5C400";


    ctx.beginPath();

    ctx.arc(
        x - 10 * escala,
        y + 12 * escala,
        8 * escala,
        0,
        Math.PI * 2
    );

    ctx.fill();


    ctx.beginPath();

    ctx.arc(
        x + 10 * escala,
        y + 12 * escala,
        8 * escala,
        0,
        Math.PI * 2
    );

    ctx.fill();


    // Cuerpo

    ctx.strokeStyle =
        "#8A5000";

    ctx.lineWidth =
        4 * escala;

    ctx.beginPath();

    ctx.moveTo(
        x,
        y - 8 * escala
    );

    ctx.lineTo(
        x,
        y + 15 * escala
    );

    ctx.stroke();


    // Antenas

    ctx.lineWidth =
        1.5 * escala;

    ctx.beginPath();

    ctx.moveTo(
        x,
        y - 8 * escala
    );

    ctx.lineTo(
        x - 9 * escala,
        y - 22 * escala
    );


    ctx.moveTo(
        x,
        y - 8 * escala
    );

    ctx.lineTo(
        x + 9 * escala,
        y - 22 * escala
    );

    ctx.stroke();

    ctx.restore();

}


// ============================================================
// TEXTO
// ============================================================

function dibujarTexto() {

    ctx.save();


    ctx.textAlign =
        "center";

    ctx.textBaseline =
        "middle";


    ctx.fillStyle =
        "#FFD21C";


    ctx.shadowBlur =
        10 * escala;

    ctx.shadowColor =
        "#7A5500";


    // --------------------------------------------------------
    // TÍTULO
    // --------------------------------------------------------

    const tamañoTitulo =
        Math.max(
            28,
            42 * escala
        );


    ctx.font =
        `bold ${tamañoTitulo}px "Trebuchet MS", "Comic Sans MS", sans-serif`;


    ctx.fillText(
        "Feliz día de las",
        X(0),
        Y(125)
    );


    ctx.fillText(
        "Flores Amarillas Chus :3",
        X(0),
        Y(65)
    );


    // --------------------------------------------------------
    // MENSAJE
    // --------------------------------------------------------

    ctx.shadowBlur = 0;


    const tamañoMensaje =
        Math.max(
            15,
            20 * escala
        );


    ctx.font =
        `${tamañoMensaje}px "Trebuchet MS", "Comic Sans MS", sans-serif`;


    ctx.fillText(
        "Recuerda que eres una persona increible ^^",
        X(0),
        Y(5)
    );


    ctx.fillText(
        "espero no ser el único que",
        X(0),
        Y(-30)
    );


    ctx.fillText(
        "te haga un detalle así",
        X(0),
        Y(-65)
    );


    ctx.fillText(
        "abrazos amifita tqm<3",
        X(0),
        Y(-100)
    );


    ctx.restore();

}


// ============================================================
// DIBUJAR TODA LA ESCENA
// ============================================================

function dibujar() {

    ctx.clearRect(
        0,
        0,
        W,
        H
    );


    // Fondo negro

    ctx.fillStyle =
        "black";

    ctx.fillRect(
        0,
        0,
        W,
        H
    );


    // --------------------------------------------------------
    // ESTRELLAS PEQUEÑAS
    // --------------------------------------------------------

    estrellas.forEach(
        function(estrella) {

            const brillo =
                .65 +
                .35 *
                Math.sin(
                    tiempo * .002 +
                    estrella.fase
                );


            ctx.fillStyle =
                "#FFD92E";


            ctx.globalAlpha =
                brillo;


            ctx.beginPath();

            ctx.arc(
                X(estrella.x),
                Y(estrella.y),
                estrella.radio * escala,
                0,
                Math.PI * 2
            );

            ctx.fill();

        }
    );


    ctx.globalAlpha = 1;


    // --------------------------------------------------------
    // ESTRELLAS GRANDES
    // --------------------------------------------------------

    const estrellasGrandes = [

        [-510,270,13],
        [-350,315,10],
        [-80,300,12],
        [80,330,10],
        [280,300,12],
        [470,275,14],
        [580,160,9],
        [-220,170,9],
        [350,160,8]

    ];


    estrellasGrandes.forEach(
        function(e) {

            dibujarEstrella(
                e[0],
                e[1],
                e[2]
            );

        }
    );


    // --------------------------------------------------------
    // LUNA
    // --------------------------------------------------------

    dibujarLuna();


    // --------------------------------------------------------
    // CORAZONES
    // --------------------------------------------------------

    corazones.forEach(
        function(corazon) {

            dibujarCorazon(
                corazon.x,
                corazon.y,
                corazon.tamaño
            );

        }
    );


    // --------------------------------------------------------
    // MARIPOSA
    // --------------------------------------------------------

    dibujarMariposa();


    // --------------------------------------------------------
    // TEXTO
    // --------------------------------------------------------

    dibujarTexto();


    // --------------------------------------------------------
    // PASTO
    // --------------------------------------------------------

    dibujarPasto();


    // --------------------------------------------------------
    // FLORES PEQUEÑAS
    // --------------------------------------------------------

    floresPequenas.forEach(
        function(flor) {

            dibujarFlorPequena(
                flor
            );

        }
    );


    // --------------------------------------------------------
    // HOJAS EXTRA
    // --------------------------------------------------------

    const hojas = [

        [-570,-310,35,60],
        [-540,-335,30,120],
        [-430,-330,32,50],
        [-350,-340,30,130],
        [-150,-330,35,60],
        [-100,-340,28,120],
        [150,-335,35,50],
        [200,-340,28,130],
        [300,-330,35,60],
        [420,-330,32,120],
        [550,-310,38,60]

    ];


    hojas.forEach(
        function(hoja) {

            dibujarHoja(
                hoja[0],
                hoja[1],
                hoja[2],
                hoja[3]
            );

        }
    );


    // --------------------------------------------------------
    // GIRASOLES
    // --------------------------------------------------------

    girasoles.forEach(
        function(flor) {

            dibujarGirasol(
                flor
            );

        }
    );


    // --------------------------------------------------------
    // PEQUEÑAS LUCES DORADAS
    // --------------------------------------------------------

    for (
        let i = 0;
        i < 20;
        i++
    ) {

        const x =
            -600 +
            ((i * 83) % 1200);


        const y =
            -220 +
            ((i * 47) % 320);


        ctx.fillStyle =
            "#FFD21C";


        ctx.globalAlpha =
            .75;


        ctx.beginPath();

        ctx.arc(
            X(x),
            Y(y),
            2.5 * escala,
            0,
            Math.PI * 2
        );

        ctx.fill();

    }


    ctx.globalAlpha = 1;


    tiempo++;


    requestAnimationFrame(
        dibujar
    );

}


// ============================================================
// INICIAR
// ============================================================

window.addEventListener(
    "resize",
    ajustarPantalla
);


ajustarPantalla();

dibujar();

</script>
